name: Build Monorepo

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # 3. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "pnpm"

      # 4. Install deps (chỉ chạy khi package.json hoặc lockfile thay đổi)
      - name: Install dependencies
        run: pnpm install

      # 5. Build toàn bộ monorepo
      - name: Build
        run: pnpm build